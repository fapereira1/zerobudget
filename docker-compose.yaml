services:
  postgres:
    image: postgres:18-alpine
    container_name: dex-postgres
    environment:
      POSTGRES_DB: dex
      POSTGRES_USER: dex
      POSTGRES_PASSWORD: dexpassword
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - auth-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dex"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: zerobudget
      POSTGRES_USER: zerobudget_admin
      POSTGRES_PASSWORD: app-admin-dev-password
    ports:
      - "127.0.0.1:${APP_POSTGRES_PORT:-5440}:5432"
    volumes:
      - app_postgres_data:/var/lib/postgresql
      - ./config/app-postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - auth-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerobudget_admin -d zerobudget"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${AUTH_REDIS_PORT:-6380}:6379"
    volumes:
      - auth_redis_data:/data
    networks:
      - auth-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  dex:
    image: dexidp/dex:v2.37.0
    container_name: dex-server
    ports:
      - "5556:5556"
    environment:
      DEXIDP_CONFIG: /etc/dex/config.yaml
    volumes:
      - ./config/dex-config.yaml:/etc/dex/config.yaml
    command: dex serve /etc/dex/config.yaml
    networks:
      - auth-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  auth-network:
    driver: bridge

volumes:
  postgres_data:
  auth_redis_data:
  app_postgres_data:
