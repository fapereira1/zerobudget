# Dex configuration for local development
issuer: http://localhost:5556

storage:
  type: postgres
  config:
    host: postgres
    port: 5432
    database: dex
    user: dex
    password: dexpassword
    ssl:
      mode: disable

web:
  http: 0.0.0.0:5556
  allowedOrigins:
    - 'http://localhost:*'
    - 'http://127.0.0.1:*'

telemetry:
  http: 0.0.0.0:5558

oauth2:
  responseTypes:
    - code
  skipApprovalScreen: false
  alwaysShowLoginScreen: false
  passwordConnector: local

connectors:
  # Local username/password login
  - type: mockPassword
    id: local
    name: Local Users
    config:
      username: admin
      password: password

  # Uncomment to add GitHub social login
  # - type: github
  #   id: github
  #   name: GitHub
  #   config:
  #     clientID: <YOUR_GITHUB_CLIENT_ID>
  #     clientSecret: <YOUR_GITHUB_CLIENT_SECRET>
  #     redirectURI: http://localhost:5556/dex/callback
  #     orgs:
  #       - name: my-org

# Client configuration - sua aplicação Rust
staticClients:
  - id: rust-app
    redirectURIs:
      - 'http://localhost:3000/callback'
      - 'http://localhost:3000/api/auth/callback'
      - 'http://localhost:3001/api/auth/callback'  # Instância local alternativa para testes
      - 'http://127.0.0.1:3000/callback'
    name: 'Rust API'
    secret: secret-rust-app-key
    logoURL: ''

  # Client para testes com curl/postman
  - id: test-client
    redirectURIs:
      - 'http://localhost:8000/callback'
      - 'urn:ietf:wg:oauth:2.0:oob'  # Out of band (CLI testing)
    name: 'Test Client'
    secret: test-secret
    public: false
