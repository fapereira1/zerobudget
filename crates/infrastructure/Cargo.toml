[package]
name = "obz-infrastructure"
version = "0.1.0"
edition = "2021"

[dependencies]
obz-cycle = { path = "../cycle" }
obz-auth = { path = "../auth" }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "migrate", "macros"] }
tokio = { version = "1", features = ["time"] }
url = "2"
thiserror = "2"
