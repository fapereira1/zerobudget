[package]
name = "obz-api"
version = "0.1.0"
edition = "2021"

[dependencies]
obz-auth = { path = "../auth" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
chrono = "0.4"
