[package]
name = "obz-auth"
version = "0.1.0"
edition = "2021"

[dependencies]
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
thiserror = "2"
subtle = "2"

[dev-dependencies]
chrono = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
